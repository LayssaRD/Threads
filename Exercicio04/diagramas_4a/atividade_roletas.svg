<polyline points="610.0,1480.0 610.0,1522.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<polyline points="730.0,1480.0 730.0,1522.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<text x="670.0" y="1505.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#57606a">…</text>
<rect x="130" y="1522" width="630" height="8" rx="2" fill="#1f2328"/>
<text x="640.0" y="1552.2" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a" font-style="italic">join: espera as N threads</text>
<rect x="75.0" y="1568.0" width="290" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="220.0" y="1590.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">Somar totPessoas</text>
<text x="220.0" y="1609.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">de cada roleta</text>
<polyline points="220.0,1530.0 220.0,1568.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<rect x="75.0" y="1653.0" width="290" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
