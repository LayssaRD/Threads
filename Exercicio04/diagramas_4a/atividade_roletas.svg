<text x="220.0" y="1037.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#57606a" font-style="italic">main fica bloqueada em</text>
<text x="220.0" y="1054.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#57606a" font-style="italic">t.join() até as N threads</text>
