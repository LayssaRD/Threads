<text x="1262.0" y="774.5" font-size="13" text-anchor="end" font-weight="normal" fill="#57606a">i++</text>
<polyline points="607.0,855.0 480.0,855.0 480.0,1440.0 515.0,1440.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<text x="601.0" y="849.5" font-size="13" text-anchor="end" font-weight="normal" fill="#57606a">[não]</text>
