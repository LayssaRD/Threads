<text x="625.0" y="1444.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">Thread rₖ termina</text>
<polyline points="625.0,1460.0 625.0,1480.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
