<polyline points="220.0,1707.0 220.0,1727.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<text x="246.0" y="1739.5" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">numPessoas == esperado ?</text>
<rect x="20.0" y="1793.0" width="180" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="110.0" y="1816.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">Exibir “OK:</text>
<text x="110.0" y="1833.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">contagem correta!”</text>
<rect x="240.0" y="1793.0" width="180" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="330.0" y="1816.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">Exibir “ERRO: perda</text>
<text x="330.0" y="1833.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">de atualizações!”</text>
