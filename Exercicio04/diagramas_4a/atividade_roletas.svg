<rect x="900.0" y="1193.0" width="260" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="1030.0" y="1215.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">Adquirir lock</text>
<text x="1030.0" y="1234.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">(entra em somar)</text>
<polyline points="1030.0,1158.0 1030.0,1193.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<text x="1038.0" y="1180.5" font-size="13" text-anchor="start" font-weight="normal" fill="#57606a">[sim]</text>
<rect x="900.0" y="1282.0" width="260" height="46" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="1030.0" y="1309.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">numPessoas += incr</text>
<polyline points="1030.0,1247.0 1030.0,1282.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<rect x="900.0" y="1363.0" width="260" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="1030.0" y="1385.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">Liberar lock</text>
<text x="1030.0" y="1404.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2328">(sai de somar)</text>
<polyline points="1030.0,1328.0 1030.0,1363.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
