<text x="966.0" y="1778.2" font-size="12" text-anchor="start" font-weight="normal" fill="#57606a" font-style="italic">join: espera as 5 threads</text>
<rect x="60.0" y="1813.0" width="300" height="54" rx="16" fill="#fdf6d8" stroke="#1f2328" stroke-width="1.6"/>
<text x="210.0" y="1836.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">Exibir “Todos os filósofos</text>
<text x="210.0" y="1853.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2328">meditaram e comeram. Sem deadlock!”</text>
<polyline points="210.0,1778.0 210.0,1813.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<circle cx="210" cy="1920" r="15" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<circle cx="210" cy="1920" r="9" fill="#1f2328"/>
<polyline points="210.0,1867.0 210.0,1903.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#open)" stroke-linejoin="round"/>
<path d="M30,700 L386,700 L400,714 L400,850 L30,850 Z" fill="#fff9c4" stroke="#1f2328" stroke-width="1.3"/>
<path d="M386,700 L386,714 L400,714" fill="none" stroke="#1f2328" stroke-width="1.3"/>
<text x="42.0" y="745.8" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">Por que não há deadlock?</text>
<text x="42.0" y="762.6" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">Todos pegam primeiro o palito de</text>
<text x="42.0" y="779.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">menor id. f4 (palitos p4 e p0) pega</text>
<text x="42.0" y="796.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">p0 antes de p4, o que quebra a</text>
<text x="42.0" y="813.4" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">espera circular.</text>
<polyline points="400.0,760.0 595.0,735.0" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="7 5" stroke-linejoin="round"/>
<path d="M30,1100 L386,1100 L400,1114 L400,1200 L30,1200 Z" fill="#fff9c4" stroke="#1f2328" stroke-width="1.3"/>
<path d="M386,1100 L386,1114 L400,1114" fill="none" stroke="#1f2328" stroke-width="1.3"/>
<text x="42.0" y="1137.6" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">Palitos vizinhos são compartilhados:</text>
<text x="42.0" y="1154.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">synchronized(palito) garante que</text>
<text x="42.0" y="1171.4" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">dois vizinhos não comam juntos.</text>
<polyline points="400.0,1150.0 630.0,1225.0" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="7 5" stroke-linejoin="round"/>
<text x="210.0" y="1437.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#57606a" font-style="italic">main fica bloqueada em</text>
<text x="210.0" y="1454.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#57606a" font-style="italic">t.join() até as 5 threads</text>
<text x="210.0" y="1471.4" font-size="13" text-anchor="middle" font-weight="normal" fill="#57606a" font-style="italic">terminarem</text>
</svg>
