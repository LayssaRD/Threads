<text x="52.0" y="765.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">Sequência de cada thread fᵢ, repetida *[r = 1..refeições]:   3.1 meditar()  →  3.2 pegar(primeiro)  →  3.3 pegar(segundo)  →  3.4 comer()  →  3.5 soltar(segundo)  →  3.6 soltar(primeiro)</text>
<text x="52.0" y="782.1" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">primeiro = palito de MENOR id entre pᵢ (direita) e p(i+1)%5 (esquerda);  segundo = o outro.</text>
<text x="52.0" y="799.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">pegar() = entrar em synchronized(palito) — se o vizinho estiver com ele, a thread bloqueia;  soltar() = sair do bloco synchronized.</text>
<text x="52.0" y="815.9" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328">2: «create» = new Filosofo(i, p[i], p[(i+1)%5])   ·   3: start() dispara a thread   ·   4: join() = main aguarda a thread terminar.</text>
</svg>
